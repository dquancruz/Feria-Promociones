services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feria}
      POSTGRES_DB: ${POSTGRES_DB:-feria}
    ports:
      # Host port 5432 is taken by a local, non-Docker Postgres install on this
      # machine; 5434 avoids the collision. Only matters for host-side tools
      # (tests, psql) — the backend container talks to `postgres:5432` internally.
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-feria}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-feria}:${POSTGRES_PASSWORD:-feria}@postgres:5432/${POSTGRES_DB:-feria}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret}
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - '4173:4173'
    depends_on:
      - backend

volumes:
  postgres-data:
