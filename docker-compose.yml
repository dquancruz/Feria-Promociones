services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feria}
      POSTGRES_DB: ${POSTGRES_DB:-feria}
    ports:
      # 5434 avoids clashing with a local Postgres that already uses port 5432.
      # Only matters for host-side tools (tests, psql) — the backend container
      # talks to `postgres:5432` internally.
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-feria}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-feria}:${POSTGRES_PASSWORD:-feria}@postgres:5432/${POSTGRES_DB:-feria}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      # The frontend serves the app and forwards /api to the backend, so the browser
      # only ever talks to http://localhost:4173.
      API_PROXY_TARGET: http://backend:4000
    ports:
      - '4173:4173'
    depends_on:
      - backend

volumes:
  postgres-data:
